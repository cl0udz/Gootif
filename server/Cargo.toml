[package]
name = "gootif"
version = "1.0.0"
edition = "2021"
description = "Gootif notification API + APNs push worker"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde_json = { version = "1", features = ["preserve_order"] }
reqwest = { version = "0.12", default-features = false, features = ["http2", "rustls-tls", "json"] }
jsonwebtoken = "9"
serde = { version = "1", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
rand = "0.8"
subtle = "2"
form_urlencoded = "1"
percent-encoding = "2"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
