name: Gootif
options:
  bundleIdPrefix: com.goosheys
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "16.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    GENERATE_INFOPLIST_FILE: true
targets:
  Gootif:
    type: application
    platform: iOS
    sources:
      - path: Gootif
        excludes:
          - "**/*.example"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.goosheys.gootif
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: 1
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: Gootif
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        DEVELOPMENT_TEAM: MV8X85T53K
