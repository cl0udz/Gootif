<VirtualHost *:80>
    ServerName gootif.jianwei.me
    RewriteEngine On
    RewriteRule ^(.*)$ https://%{HTTP_HOST}$1 [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName gootif.jianwei.me
    # Nothing is served from disk any more; the API is the Rust service (gootif-api.service).
    DocumentRoot /var/www/gootif-public

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/gootif.jianwei.me/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/gootif.jianwei.me/privkey.pem

    <Directory /var/www/gootif-public>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>

    ProxyPreserveHost On
    ProxyPass        /api/ http://127.0.0.1:18090/api/ retry=0 timeout=30
    ProxyPassReverse /api/ http://127.0.0.1:18090/api/

    <IfModule mod_headers.c>
        Header always set Strict-Transport-Security "max-age=31536000"
        Header always set X-Content-Type-Options "nosniff"
    </IfModule>

    ErrorLog ${APACHE_LOG_DIR}/gootif_error.log
    CustomLog ${APACHE_LOG_DIR}/gootif_access.log combined
</VirtualHost>
